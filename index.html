<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
    }

    .message {
      padding: 16px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    #scanner {
      position: relative;

      width: 100%;
      max-width: 600px;

      height: 360px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    /*
     * Quagga2がカメラ映像を入れる場所
     */
    #scanner video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    /*
     * Quagga2のcanvas
     */
    #scanner canvas {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    /*
     * 読み取り目安
     */
    .scan-frame {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 30%;
      height: 40%;

      border: 4px solid red;

      z-index: 10;

      pointer-events: none;
    }

    /*
     * 中央線
     */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    #result {
      min-height: 100px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 34px;

      font-weight: bold;

      word-break: break-all;
    }

  </style>

</head>


<body>


  <header>
    らくらく　パック
  </header>


  <div class="message">
    JANバーコードを赤枠に合わせてください
  </div>


  <div id="scanner">

    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>

  </div>


  <div id="result">
    カメラ起動中…
  </div>


  <!-- Quagga2 -->
  <script
    src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.2.6/dist/quagga.min.js">
  </script>


  <script>

    const result =
      document.getElementById("result");


    /*
     * Quagga2開始
     */
    Quagga.init({

      inputStream: {

        name: "Live",

        type: "LiveStream",

        target:
          document.querySelector("#scanner"),

        constraints: {

          facingMode: "environment",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        /*
         * カメラ映像を解析する範囲
         */
        area: {

          top: "30%",

          right: "5%",

          left: "5%",

          bottom: "30%"

        }

      },


      /*
       * 今回はJANだけ
       */
      decoder: {

        readers: [
          "ean_reader"
        ]

      },


      /*
       * バーコードを探す
       */
      locate: true,


      locator: {

        halfSample: false,

        patchSize: "medium"

      },


      numOfWorkers: 2,

      frequency: 10,


      debug: false

    },


    function(error) {


      if (error) {

        console.error(
          "Quagga起動エラー:",
          error
        );

        result.textContent =
          "エラー：" + String(error);

        return;

      }


      console.log(
        "Quagga2 起動成功"
      );


      result.textContent =
        "JAN読み取り中…";


      /*
       * カメラ開始
       */
      Quagga.start();

    });


    /*
     * バーコード検出
     */
    Quagga.onDetected(function(data) {


      if (
        !data ||
        !data.codeResult
      ) {

        return;

      }


      const code =
        data.codeResult.code;


      if (!code) {

        return;

      }


      console.log(
        "★ JAN読み取り成功 ★",
        code
      );


      /*
       * 読み取ったJANを表示
       */
      result.textContent =
        code;

    });


  </script>


</body>

</html>
