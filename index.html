<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 300px;
      margin: 15px auto 0;
      overflow: hidden;
      background: #000;
    }

    #reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scanFrame {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 30%;
      height: 40%;
      border: 3px solid red;
      pointer-events: none;
    }

    #status {
      margin-top: 15px;
      font-size: 20px;
      color: #ccc;
    }

  </style>

</head>

<body>

  <header>
    らくらく パック
  </header>

  <div id="cameraArea">

```
<video
  id="reader"
  autoplay
  muted
  playsinline>
</video>

<div id="scanFrame"></div>
```

  </div>

  <div id="status">
    起動処理を開始します...
  </div>

  <script>

    const video =
      document.getElementById("reader");

    const status =
      document.getElementById("status");


    // ==========================
    // カメラだけ起動
    // ==========================

    async function startCamera() {

      status.textContent =
        "カメラを起動しています...";


      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false

          });


        video.srcObject =
          stream;


        await video.play();


        status.textContent =
          "カメラ起動成功";


        console.log(
          "カメラ起動成功"
        );


      } catch (error) {

        console.error(
          "カメラエラー:",
          error
        );


        status.textContent =
          "カメラエラー: " +
          error.name +
          " / " +
          error.message;

      }

    }


    // ==========================
    // ページ起動
    // ==========================

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startCamera
      );

    } else {

      startCamera();

    }

  </script>

</body>

</html>
