<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>らくらくA パック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 60px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    #reader video {
      width: 100%;
      height: auto;
      display: block;
    }

    #result {
      padding: 20px 10px;
      font-size: 28px;
      font-weight: bold;
      background: white;
      color: #12395b;
      min-height: 80px;
    }

    .message {
      padding: 12px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <header>
    らくらくD　パック
  </header>

  <div class="message">
    CCバーコードをかざしてください
  </div>

  <div id="reader"></div>

  <div id="result">
    カメラ起動中…
  </div>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <script>

    const result = document.getElementById("result");

    async function startScanner() {

      try {

        const codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();

        result.textContent = "カメラ起動中…";

        await codeReader.decodeFromVideoDevice(
          undefined,
          "reader",
          (resultCode, error) => {

            if (resultCode) {

              const value = resultCode.getText();

              console.log("読み取り:", value);

              result.textContent = value;

            }

          }
        );

      } catch (error) {

//        console.error(error);
//        result.textContent =
//          "カメラを起動できません";
        console.error("カメラエラー:", error);
        result.textContent =　"エラー：" + String(error);
        alert("カメラエラー：" + String(error));
              
      }

    }

    startScanner();

  </script>

</body>
</html>
