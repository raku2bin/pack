<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>QRスキャン</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      const SERVER_URL = "https://script.google.com/macros/s/AKfycbz27tAOy_dx-iLzVdN6odJoB_wFRLUutQNvPz00g37LczepdEXbtdYYhyCcV80QgFtp/exec";
 
      function onScanSuccess(decodedText) {

      // 🔔 ピッピ音
        playPippi();

 
        // 📳 振動する（対応端末のみ）
        if (navigator.vibrate) {
          navigator.vibrate([200]); // 200ms
        }

        document.getElementById("result").innerText = "読み取り中: " + decodedText;

        // サーバーに送信
        fetch(SERVER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            page: "scan",
            code: decodedText
          }).toString()
        })
        .then(res => res.text())
        .then(text => {
          document.getElementById("result").innerText = `結果: ${text}`;

          // 3秒後に再開
          html5QrCode.stop().then(() => {
            setTimeout(() => {
              html5QrCode.start(currentCameraId, config, onScanSuccess);
              document.getElementById("result").innerText = "スキャン待機中...";
            }, 3000);
          });
        })
        .catch(err => {
          document.getElementById("result").innerText = "通信エラー";
        });
      }
    </script>
 
 <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      #reader {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }

      #result {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        font-size: 18px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="reader"></div>
    <div id="result">スキャン待機中...</div>

    <script>
      const SERVER_URL = "https://script.google.com/macros/s/AKfycbz27tAOy_dx-iLzVdN6odJoB_wFRLUutQNvPz00g37LczepdEXbtdYYhyCcV80QgFtp/exec";

      function onScanSuccess(decodedText) {
        document.getElementById("result").innerText = "読み取り中: " + decodedText;

        // サーバーに送信（code + page=scan）
        fetch(SERVER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            page: "scan",
            code: decodedText
          }).toString()
        })
        .then(res => res.text())
        .then(text => {
          document.getElementById("result").innerText = `結果: ${text}`;

          // 3秒後に再開
          html5QrCode.stop().then(() => {
            setTimeout(() => {
              html5QrCode.start(currentCameraId, config, onScanSuccess);
              document.getElementById("result").innerText = "スキャン待機中...";
            }, 3000);
          });
        })
        .catch(err => {
          document.getElementById("result").innerText = "通信エラー";
        });
      }

      const html5QrCode = new Html5Qrcode("reader");
      let currentCameraId = null;
      const config = {
        fps: 10,
        qrbox: { width: window.innerWidth * 0.8, height: window.innerHeight * 0.8 },
        aspectRatio: window.innerWidth / window.innerHeight
      };

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          // 背面カメラを優先
          currentCameraId = devices[0].id;
          for (let device of devices) {
            if (device.label.toLowerCase().includes("back") || device.label.toLowerCase().includes("environment")) {
              currentCameraId = device.id;
              break;
            }
          }

          html5QrCode.start(currentCameraId, config, onScanSuccess);
        }
      }).catch(err => {
        document.getElementById("result").innerText = "カメラ取得エラー";
        console.error(err);
      });
    </script>
  </body>
</html>
