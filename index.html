<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    .message {
      padding: 15px 10px;
      font-size: 24px;
      font-weight: bold;
      background: #111;
    }

    .camera-area {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #000;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: auto;
      min-height: 300px;
      display: block;
      background: #000;
      object-fit: cover;
    }

    /*
     * 赤枠
     * ※これは見た目上のガイドです。
     * ZXingの読み取り範囲そのものを制限するものではありません。
     */
    .scan-frame {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 25%;
      height: 50%;
      border: 4px solid red;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      background: red;
      transform: translateY(-50%);
    }

    #result {
      min-height: 90px;
      padding: 18px 10px;
      background: white;
      color: #12395b;
      font-size: 34px;
      font-weight: bold;
      word-break: break-all;
    }

    #format {
      min-height: 50px;
      padding: 10px;
      background: #ddd;
      color: #111;
      font-size: 19px;
      font-weight: bold;
    }

    #inspection {
      padding: 18px 10px;
      background: #222;
      min-height: 100px;
    }

    #inspectionTitle {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #inspectionMessage {
      font-size: 22px;
      font-weight: bold;
    }

    .jan {
      color: #00ff66;
    }

    .kiykcd {
      color: #00ccff;
    }

    .error {
      color: #ff4444;
    }
  </style>
</head>
