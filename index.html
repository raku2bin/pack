<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>らくらく パック</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
    }

    .message {
      padding: 16px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto;
      display: block;
      background: #000;
    }

    #result {
      padding: 20px 10px;
      font-size: 32px;
      font-weight: bold;
      background: white;
      color: #12395b;
      min-height: 90px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <header>
    らくらく　パック
  </header>

  <div class="message">
    CCバーコードをかざしてください
  </div>

  <video
    id="reader"
    autoplay
    muted
    playsinline>
  </video>

  <div id="result">
    カメラ準備中…
  </div>

  <!-- ZXing Browser 最新版 -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

<script>
  const result = document.getElementById("result");
  const video = document.getElementById("reader");

  async function startScanner() {

    try {

      result.textContent = "カメラ起動中…";

      const codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();

      // カメラ一覧を取得
      const devices =
        await ZXingBrowser.BrowserCodeReader
          .listVideoInputDevices();

      if (!devices || devices.length === 0) {
        result.textContent = "カメラが見つかりません";
        return;
      }

      // スマホでは最後のカメラを使用
      const deviceId =
        devices[devices.length - 1].deviceId;

      console.log("使用カメラ:", deviceId);

      // 連続スキャン開始
      const controls =
        await codeReader.decodeFromVideoDevice(
          deviceId,
          video,
          (resultCode, error) => {

            if (resultCode) {

              const value =
                resultCode.getText();

              console.log("読み取り成功:", value);

              result.textContent = value;
            }

          }
        );

      console.log("スキャン開始完了");

      result.textContent =
        "バーコードをかざしてください";

    } catch (error) {

      console.error("スキャンエラー:", error);

      result.textContent =
        "エラー：" + String(error);

    }

  }

  startScanner();
</script>
  
</body>
</html>
