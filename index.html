<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    /* ヘッダー */
    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
    }

    /* 説明 */
    .message {
      padding: 18px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    /* カメラ部分 */
    .camera-area {
      position: relative;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    /* カメラ映像 */
    #reader {
      width: 100%;
      height: auto;

      display: block;

      background: #000;
    }

    /* 読み取り枠 */
    .scan-frame {
      position: absolute;

      left: 7%;
      right: 7%;

      top: 35%;

      height: 30%;

      border: 4px solid red;

      pointer-events: none;
    }

    /* 中央線 */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    /* 枠内の説明 */
    .frame-message {
      position: absolute;

      left: 0;
      right: 0;

      bottom: 8%;

      font-size: 20px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 2px 4px #000,
        0 0 5px #000;
    }

    /* 読み取り結果 */
    #result {
      min-height: 100px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 34px;

      font-weight: bold;

      word-break: break-all;
    }

  </style>

</head>


<body>


  <header>
    らくらく　パック
  </header>


  <div class="message">
    ABC バーコードを枠内に合わせてください
  </div>


  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-frame">

      <div class="scan-line"></div>

    </div>


    <div class="frame-message">
      赤い枠にバーコードを合わせてください
    </div>

  </div>


  <div id="result">
    カメラ起動中…
  </div>


  <!-- ZXing Browser -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <script>

    const result =
      document.getElementById("result");

    const video =
      document.getElementById("reader");


    async function startScanner() {

      try {

        /*
         * 1次元バーコード専用リーダー
         */
        const codeReader =
          new ZXingBrowser.BrowserMultiFormatOneDReader();


        /*
         * カメラ一覧を取得
         */
        const devices =
          await ZXingBrowser.BrowserCodeReader
            .listVideoInputDevices();


        console.log(
          "カメラ一覧:",
          devices
        );


        /*
         * カメラがない場合
         */
        if (
          !devices ||
          devices.length === 0
        ) {

          result.textContent =
            "カメラが見つかりません";

          return;
        }


        /*
         * 最初のカメラ
         */
        let deviceId =
          devices[0].deviceId;


        /*
         * 背面カメラを探す
         */
        for (
          const device of devices
        ) {

          const label =
            (device.label || "")
              .toLowerCase();


          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("背面")
          ) {

            deviceId =
              device.deviceId;

            break;
          }

        }


        console.log(
          "使用カメラ:",
          deviceId
        );


        /*
         * 読み取り開始
         */
        result.textContent =
          "バーコード読み取り中…";


        /*
         * 連続読み取り
         *
         * バーコードを検出するたびに
         * 下のcallbackが実行される
         */
        await codeReader.decodeFromVideoDevice(

          deviceId,

          video,

          (resultCode, error) => {


            /*
             * 読み取り成功
             */
            if (resultCode) {

              const value =
                resultCode.getText();


              console.log(
                "★ 読み取り成功 ★",
                value
              );


              /*
               * 読み取った数字を表示
               */
              result.textContent =
                value;

            }

          }

        );


      } catch (error) {


        console.error(
          "読み取りエラー:",
          error
        );


        result.textContent =
          "エラー：" + String(error);

      }

    }


    /*
     * スキャナー開始
     */
    startScanner();

  </script>


</body>

</html>
