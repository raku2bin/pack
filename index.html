<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 60px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    #result {
      padding: 20px 10px;
      font-size: 28px;
      font-weight: bold;
      background: white;
      color: #12395b;
      min-height: 80px;
    }

    .message {
      padding: 12px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    らくらく　パック
  </header>

  <div class="message">
    バーコードをかざしてください
  </div>

  <div id="reader"></div>

  <div id="result">
    読み取り待機中
  </div>

  <!-- バーコード読み取りライブラリ -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <script>

    const result = document.getElementById("result");

    // カメラを起動
    async function startScanner() {

      try {

        const codeReader = new ZXingBrowser.BrowserMultiFormatReader();

        // 背面カメラを優先
        const devices =
          await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

        if (devices.length === 0) {
          result.textContent = "カメラが見つかりません";
          return;
        }

        let deviceId = devices[devices.length - 1].deviceId;

        // バーコード読み取り開始
        codeReader.decodeFromVideoDevice(
          deviceId,
          "reader",
          (resultCode, error) => {

            if (resultCode) {

              const value = resultCode.getText();

              console.log("読み取り:", value);

              result.textContent = value;

            }

          }
        );

      } catch (error) {

        console.error(error);

        result.textContent =
          "カメラを起動できません";

      }

    }

    startScanner();

  </script>

</body>
</html>
