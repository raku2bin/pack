<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #111;
      color: white;

      font-family: sans-serif;

      text-align: center;
    }


    /* ================================
       ヘッダー
    ================================= */

    header {

      height: 70px;

      background: #12395b;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      font-weight: bold;
    }


    /* ================================
       説明
    ================================= */

    .message {

      padding: 10px;

      font-size: 20px;

      font-weight: bold;

      background: #111;
    }


    /* ================================
       カメラエリア
    ================================= */

    .camera-area {

      position: relative;

      width: 100%;

      max-width: 500px;

      height: 260px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }


    /* ================================
       カメラ
    ================================= */

    #reader {

      width: 100%;

      height: 260px;

      display: block;

      background: #000;

      object-fit: cover;
    }


    /* ================================
       赤枠
    ================================= */

    .scan-frame {

      position: absolute;

      left: 5%;

      right: 5%;

      top: 25%;

      height: 50%;

      border: 4px solid red;

      pointer-events: none;
    }


    /* ================================
       赤ライン
    ================================= */

    .scan-line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);

      pointer-events: none;
    }


    /* ================================
       状態
    ================================= */

    #status {

      padding: 8px;

      font-size: 18px;

      font-weight: bold;

      background: #333;
    }


    /* ================================
       結果
    ================================= */

    #result {

      min-height: 70px;

      padding: 12px 8px;

      background: white;

      color: #12395b;

      font-size: 30px;

      font-weight: bold;

      word-break: break-all;
    }


    /* ================================
       種類
    ================================= */

    #format {

      min-height: 40px;

      padding: 8px;

      background: #ddd;

      color: #111;

      font-size: 18px;

      font-weight: bold;

       検品

    #inspection {

      padding: 15px 10px;

      background: #222;

    .kiykcd {

    }

    }

  </style>

</head>


<body>


  <!-- ================================
       ヘッダー
  ================================= -->

  <header>

    らくらく　パック

  </header>


  <!-- ================================
       説明
  ================================= -->

  <div class="message">

    バーコードを赤枠に合わせてください

  </div>


  <!-- ================================
       カメラ
  ================================= -->

  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-frame">

      <div class="scan-line"></div>

    </div>

  </div>


  <!-- ================================
       状態
  ================================= -->

  <div id="status">

    カメラ起動中...

  </div>


  <!-- ================================
       読み取り結果
  ================================= -->

  <div id="result">

    読み取り待機中

  </div>


  <!-- ================================
       バーコード種類
  ================================= -->

  <div id="format">

    -

  </div>


  <!-- ================================
       検品状態
  ================================= -->

  <div id="inspection">

    <div id="inspectionTitle">

      検品状態

    </div>


    <div id="inspectionMessage">

      JANコードを読み取ってください

    </div>

  </div>



<script>


  // ==========================================
  // HTML要素
  // ==========================================

  const video =
    document.getElementById("reader");

  const result =
    document.getElementById("result");

  const format =
    document.getElementById("format");

  const status =
    document.getElementById("status");

  const inspectionMessage =
    document.getElementById(
      "inspectionMessage"
    );


  // ==========================================
  // 重複防止
  // ==========================================

  let lastCode = "";

  let lastReadTime = 0;

  const DUPLICATE_WAIT = 500;


  // ==========================================
  // ZXing
  // ==========================================

  let codeReader = null;


  // ==========================================
  // カメラ開始
  // ==========================================

  function startScanner() {

    try {

      status.textContent =
        "カメラ起動中...";


      // --------------------------------------
      // ZXingリーダー
      // --------------------------------------

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      // --------------------------------------
      // ZXingにカメラ起動を任せる
      // --------------------------------------

      codeReader.decodeFromConstraints(

        {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        },

        video,

        function (
          resultData,
          error
        ) {


          // ----------------------------------
          // 読み取りなし
          // ----------------------------------

          if (!resultData) {

            return;

          }


          // ----------------------------------
          // 読み取り値
          // ----------------------------------

          const text =
            resultData.getText();


          const now =
            Date.now();


          // ----------------------------------
          // 重複防止
          // ----------------------------------

          if (

            text === lastCode &&

            now - lastReadTime <
            DUPLICATE_WAIT

          ) {

            return;

          }


          lastCode =
            text;

          lastReadTime =
            now;


          // ----------------------------------
          // 処理
          // ----------------------------------

          processBarcode(text);

        }

      );


      status.textContent =
        "スキャン待機中";


    } catch (error) {

      console.error(
        "ZXing起動エラー:",
        error
      );


      status.textContent =
        "カメラ読み取りエラー";


      result.textContent =
        "読み取り開始エラー";

    }

  }


  // ==========================================
  // バーコード処理
  // ==========================================

  function processBarcode(text) {


    console.log(
      "読み取り:",
      text
    );


    result.textContent =
      text;


    // ========================================
    // JAN
    // ========================================

    if (

      /^[0-9]{8}$/.test(text) ||

      /^[0-9]{12}$/.test(text) ||

      /^[0-9]{13}$/.test(text)

    ) {


      result.className =
        "jan";


      format.textContent =
        "JAN";


      inspectionMessage.textContent =
        "JAN読み取り";


      beep();


      return;

    }


    // ========================================
    // 18桁
    // ========================================

    if (
      /^[0-9]{18}$/.test(text)
    ) {


      result.className =
        "kiykcd";


      format.textContent =
        "KIYKCD / 18桁";


      inspectionMessage.textContent =
        "KIYKCD読み取り";


      beep();


      return;

    }


    // ========================================
    // その他
    // ========================================

    result.className =
      "error";


    format.textContent =
      "その他";


    inspectionMessage.textContent =
      "未対応コード";

  }


  // ==========================================
  // ピッ音
  // ==========================================

  function beep() {

    try {


      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      const audioContext =
        new AudioContext();


      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      oscillator.frequency.value =
        1800;


      oscillator.type =
        "square";


      gain.gain.value =
        0.08;


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start();


      oscillator.stop(

        audioContext.currentTime +
        0.08

      );


    } catch (e) {

      console.log(
        "音声エラー",
        e
      );

    }

  }


  // ==========================================
  // ページ読み込み後
  // ==========================================

  window.addEventListener(
    "load",
    function () {

      startScanner();

    }
  );


</script>


</body>

</html>
