<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    .message {
      padding: 18px 10px;
      font-size: 25px;
      font-weight: bold;
    }

    .camera-area {
      position: relative;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: auto;

      display: block;

      background: #000;
    }

    /*
     * 読み取り位置
     */
    .scan-frame {
      position: absolute;

      left: 4%;
      right: 4%;

      top: 25%;
      height: 50%;

      border: 5px solid red;

      pointer-events: none;
    }

    /*
     * 中央ライン
     */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    /*
     * 読み取り結果
     */
    #result {
      min-height: 110px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 36px;

      font-weight: bold;

      word-break: break-all;
    }

    /*
     * バーコード形式
     */
    #format {
      min-height: 50px;

      padding: 10px;

      background: #ddd;

      color: #111;

      font-size: 20px;

      font-weight: bold;
    }

  </style>

</head>


<body>


  <header>
    らくらく　パック
  </header>


  <div class="message">
    バーコードを赤枠に合わせてください
  </div>


  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-frame">

      <div class="scan-line"></div>

    </div>

  </div>


  <div id="result">
    カメラ起動中…
  </div>


  <div id="format">
    JAN / NW-7 読み取り準備中…
  </div>


  <!-- ZXing Browser -->

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


  <!-- ZXing Library -->

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>


  <script>

    const result =
      document.getElementById("result");

    const format =
      document.getElementById("format");

    const video =
      document.getElementById("reader");


    /*
     * スキャナー開始
     */
    async function startScanner() {

      try {

        /*
         * ZXingが読み込まれているか確認
         */
        if (
          typeof ZXing === "undefined"
        ) {

          result.textContent =
            "ZXingが読み込めません";

          format.textContent =
            "ライブラリエラー";

          return;

        }


        /*
         * 読み取り対象
         *
         * EAN-13 = JAN
         * CODABAR = NW-7
         */
        const hints =
          new Map();


        hints.set(

          ZXing.DecodeHintType.POSSIBLE_FORMATS,

          [

            ZXing.BarcodeFormat.EAN_13,

            ZXing.BarcodeFormat.CODABAR

          ]

        );


        /*
         * より強く読み取る
         */
        hints.set(

          ZXing.DecodeHintType.TRY_HARDER,

          true

        );


        /*
         * MultiFormatReader
         */
        const codeReader =
          new ZXingBrowser.BrowserMultiFormatReader(
            hints
          );


        result.textContent =
          "カメラ起動中…";


        format.textContent =
          "JAN / NW-7 を検出中…";


        /*
         * カメラ一覧取得
         */
        const devices =
          await ZXingBrowser
            .BrowserCodeReader
            .listVideoInputDevices();


        console.log(
          "カメラ一覧:",
          devices
        );


        /*
         * カメラなし
         */
        if (
          !devices ||
          devices.length === 0
        ) {

          result.textContent =
            "カメラが見つかりません";

          format.textContent =
            "カメラなし";

          return;

        }


        /*
         * 使用カメラ
         */
        let deviceId =
          devices[0].deviceId;


        /*
         * 背面カメラを優先
         */
        for (
          const device of devices
        ) {

          const label =
            (
              device.label || ""
            ).toLowerCase();


          if (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment") ||

            label.includes("背面")

          ) {

            deviceId =
              device.deviceId;

            break;

          }

        }


        console.log(
          "使用カメラ:",
          deviceId
        );


        result.textContent =
          "バーコード読み取り中…";


        format.textContent =
          "JAN / NW-7";


        /*
         * 連続読み取り
         */
        await codeReader.decodeFromVideoDevice(

          deviceId,

          video,

          (resultCode, error) => {


            /*
             * 読み取り成功
             */
            if (resultCode) {

              const value =
                resultCode.getText();


              console.log(
                "======================"
              );

              console.log(
                "★ 読み取り成功 ★"
              );

              console.log(
                "番号:",
                value
              );


              /*
               * バーコード形式
               */
              let type =
                "不明";


              try {

                type =
                  resultCode
                    .getBarcodeFormat();

              }
              catch (e) {

                type =
                  "不明";

              }


              console.log(
                "形式:",
                type
              );


              /*
               * 結果表示
               */
              result.textContent =
                value;


              format.textContent =
                "形式：" + type;


              console.log(
                "======================"
              );

            }

          }

        );


      }
      catch (error) {

        console.error(
          "カメラ・読み取りエラー:",
          error
        );


        result.textContent =
          "エラー：" +
          (
            error.name ||
            error.message ||
            String(error)
          );


        format.textContent =
          "読み取りエラー";

      }

    }


    /*
     * 起動
     */
    startScanner();

  </script>


</body>

</html>
