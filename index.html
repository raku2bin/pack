<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <!-- html5-qrcode -->

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    /* =========================
       カメラ画面
    ========================= */

    #reader {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: #000;
    }


    /*
      html5-qrcodeが作る
      videoを画面いっぱいにする
    */

    #reader video {

      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }


    /* =========================
       スキャン枠
    ========================= */

    #scanFrame {

      position: fixed;

      z-index: 20;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      width: 90vw;
      max-width: 600px;

      height: 150px;

      border:
        3px solid red;

      border-radius: 8px;

      pointer-events: none;
    }


    /* 中央ライン */

    #scanLine {

      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 2px;

      background: red;
    }


    /* =========================
       上部タイトル
    ========================= */

    #title {

      position: fixed;

      z-index: 30;

      top: 15px;
      left: 50%;

      transform:
        translateX(-50%);

      color: white;

      background:
        rgba(0, 0, 0, 0.65);

      padding:
        8px 18px;

      border-radius: 20px;

      font-size: 18px;

      font-weight: bold;

      white-space: nowrap;
    }


    /* =========================
       結果表示
    ========================= */

    #result {

      position: fixed;

      z-index: 30;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%);

      width: 90%;

      max-width: 600px;

      padding: 12px 16px;

      color: white;

      background:
        rgba(0, 0, 0, 0.75);

      border-radius: 10px;

      text-align: center;

      font-size: 18px;

      font-weight: bold;
    }


    /* =========================
       エラー表示
    ========================= */

    #error {

      position: fixed;

      z-index: 40;

      top: 60px;
      left: 50%;

      transform:
        translateX(-50%);

      width: 90%;

      max-width: 600px;

      padding: 10px;

      color: white;

      background:
        rgba(180, 0, 0, 0.85);

      border-radius: 8px;

      text-align: center;

      font-size: 15px;

      display: none;
    }


    /* =========================
       html5-qrcode UIを非表示
    ========================= */

    #reader__dashboard_section {

      display: none !important;
    }


    #reader__status_span {

      display: none !important;
    }


    #reader__scan_region {

      border: none !important;
    }

  </style>

</head>

<body>

  <!-- カメラ -->

  <div id="reader"></div>

  <!-- タイトル -->

  <div id="title">
    らくらく パック
  </div>

  <!-- スキャン枠 -->

  <div id="scanFrame">

<div id="scanLine"></div>
```

  </div>

  <!-- 結果 -->

  <div id="result">
    カメラ起動中...
  </div>

  <!-- エラー -->

  <div id="error"></div>

<script>


/* =====================================================
   基本設定
===================================================== */


/*
  GASのURL
*/

const SERVER_URL =
  "https://script.google.com/macros/s/AKfycbz27tAOy_dx-iLzVdN6odJoB_wFRLUutQNvPz00g37LczepdEXbtdYYhyCcV80QgFtp/exec";


/*
  HTML要素
*/

const result =
  document.getElementById("result");

const errorBox =
  document.getElementById("error");


/*
  html5-qrcode本体
*/

const html5QrCode =
  new Html5Qrcode("reader");


/*
  現在使用しているカメラ
*/

let currentCameraId = null;


/*
  読み取り処理中か
*/

let processing = false;


/*
  最後に読み取ったコード
*/

let lastCode = "";


/*
  最後に読み取った時刻
*/

let lastReadTime = 0;


/* =====================================================
   音
===================================================== */

function playPippi() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type = "sine";


    oscillator.frequency.value =
      1200;


    gain.gain.value =
      0.15;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    setTimeout(() => {

      oscillator.stop();

      audioContext.close();

    }, 100);

  }

  catch (e) {

    console.log(
      "音声エラー:",
      e
    );

  }

}


/* =====================================================
   エラー表示
===================================================== */

function showError(message) {

  console.error(message);

  errorBox.innerText =
    message;

  errorBox.style.display =
    "block";
}


/*
  エラーを消す
*/

function clearError() {

  errorBox.style.display =
    "none";

}


/* =====================================================
   CODE128読み取り成功
===================================================== */

function onScanSuccess(decodedText, decodedResult) {


  /*
    すでにサーバー処理中なら無視
  */

  if (processing) {

    return;

  }


  /*
    前後の空白を削除
  */

  const code =
    String(decodedText).trim();


  /*
    ================================================
    重要
    18桁の数字だけを正式なバーコードとして受け付ける
    ================================================
  */

  if (!/^\d{18}$/.test(code)) {

    console.log(
      "18桁ではないため無視:",
      code
    );

    return;

  }


  /*
    同じコードを短時間に何度も
    読み取ることを防止
  */

  const now =
    Date.now();


  if (
    code === lastCode &&
    now - lastReadTime < 1500
  ) {

    return;

  }


  lastCode =
    code;

  lastReadTime =
    now;


  /*
    処理中
  */

  processing =
    true;


  /*
    音
  */

  playPippi();


  /*
    振動
  */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(100);

  }


  /*
    画面表示
  */

  result.innerText =
    "読み取り中: " + code;


  /*
    デバッグログ
  */

  console.log(
    "CODE128 読み取り:",
    code
  );


  console.log(
    "文字数:",
    code.length
  );


  /*
    GASへ送信
  */

  sendToServer(code);

}


/* =====================================================
   GASへ送信
===================================================== */

function sendToServer(code) {


  fetch(

    SERVER_URL,

    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/x-www-form-urlencoded"

      },

      body:

        new URLSearchParams({

          page: "scan",

          code: code

        }).toString()

    }

  )

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "HTTPエラー: " +
        response.status
      );

    }

    return response.text();

  })

  .then(text => {


    /*
      GASの結果表示
    */

    result.innerText =
      "結果: " + text;


    /*
      3秒後に再スキャン
    */

    setTimeout(() => {

      processing =
        false;


      result.innerText =
        "スキャン待機中...";


      /*
        同じコードを
        次回すぐに受け付けられるようにする
      */

      lastCode = "";


    }, 3000);

  })

  .catch(error => {


    console.error(
      "通信エラー:",
      error
    );


    result.innerText =
      "通信エラー";


    /*
      3秒後に再開
    */

    setTimeout(() => {

      processing =
        false;

      result.innerText =
        "スキャン待機中...";

      lastCode = "";

    }
