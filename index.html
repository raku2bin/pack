<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    .message {
      padding: 18px 10px;
      font-size: 25px;
      font-weight: bold;
    }

    .camera-area {
      position: relative;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: auto;

      display: block;

      background: #000;
    }

    /*
     * 読み取り枠
     */
    .scan-frame {
      position: absolute;

      left: 4%;
      right: 4%;

      top: 25%;
      height: 50%;

      border: 5px solid red;

      pointer-events: none;
    }

    /*
     * 中央ライン
     */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    /*
     * 結果
     */
    #result {
      min-height: 110px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 36px;

      font-weight: bold;

      word-break: break-all;
    }

    /*
     * 状態
     */
    #status {
      min-height: 55px;

      padding: 10px;

      background: #ddd;

      color: #111;

      font-size: 20px;

      font-weight: bold;
    }

  </style>

</head>


<body>


  <header>
    らくらく　パック
  </header>


  <div class="message">
    AAA 18桁バーコードを赤枠に合わせてください
  </div>


  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-frame">

      <div class="scan-line"></div>

    </div>

  </div>


  <div id="result">
    カメラ起動中…
  </div>


  <div id="status">
    ITF（I 2 of 5）読み取り準備中…
  </div>


  <!-- ZXing Browser -->

  <script
    src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js">
  </script>


  <script>

    const result =
      document.getElementById("result");

    const status =
      document.getElementById("status");

    const video =
      document.getElementById("reader");


    async function startScanner() {

      try {

        /*
         * ITFだけを指定
         */
        const hints = new Map();


        hints.set(

          ZXing.DecodeHintType.POSSIBLE_FORMATS,

          [
            ZXing.BarcodeFormat.ITF
          ]

        );


        /*
         * より強く解析
         */
        hints.set(

          ZXing.DecodeHintType.TRY_HARDER,

          true

        );


        /*
         * ZXing
         */
        const codeReader =
          new ZXingBrowser.BrowserMultiFormatReader(
            hints
          );


        result.textContent =
          "カメラ起動中…";


        status.textContent =
          "ITF（I 2 of 5）を読み取り中…";


        /*
         * カメラ一覧
         */
        const devices =
          await ZXingBrowser
            .BrowserCodeReader
            .listVideoInputDevices();


        console.log(
          "カメラ一覧:",
          devices
        );


        if (
          !devices ||
          devices.length === 0
        ) {

          result.textContent =
            "カメラが見つかりません";

          status.textContent =
            "カメラなし";

          return;

        }


        /*
         * 最初のカメラ
         */
        let deviceId =
          devices[0].deviceId;


        /*
         * 背面カメラを優先
         */
        for (
          const device of devices
        ) {

          const label =
            (
              device.label || ""
            ).toLowerCase();


          if (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment") ||

            label.includes("背面")

          ) {

            deviceId =
              device.deviceId;

            break;

          }

        }


        console.log(
          "使用カメラ:",
          deviceId
        );


        result.textContent =
          "18桁バーコード読み取り中…";


        /*
         * 読み取り開始
         */
        await codeReader.decodeFromVideoDevice(

          deviceId,

          video,

          (resultCode, error) => {


            if (!resultCode) {

              return;

            }


            /*
             * 読み取り成功
             */
            const value =
              resultCode.getText();


            console.log(
              "======================"
            );

            console.log(
              "★ ITF 読み取り成功 ★"
            );

            console.log(
              "番号:",
              value
            );

            console.log(
              "======================"
            );


            result.textContent =
              value;


            status.textContent =
              "ITF 読み取り成功";


          }

        );


      }
      catch (error) {

        console.error(
          "ZXingエラー:",
          error
        );


        result.textContent =
          "エラー：" +
          (
            error.name ||
            error.message ||
            String(error)
          );


        status.textContent =
          "読み取りエラー";

      }

    }


    /*
     * 開始
     */
    startScanner();

  </script>


</body>

</html>
