<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 360px;
      margin: 15px auto 0;
      overflow: hidden;
      background: #000;
    }

    #reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scanFrame {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 30%;
      height: 40%;
      border: 3px solid red;
      pointer-events: none;
    }

    #status {
      margin-top: 15px;
      font-size: 22px;
      color: #ccc;
    }

    #result {
      margin-top: 15px;
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
      word-break: break-all;
    }

    #format {
      margin-top: 8px;
      font-size: 18px;
      color: #aaa;
    }
  </style>

</head>

<body>

  <header>
    らくらく パック
  </header>

  <div id="cameraArea">

```
<video
  id="reader"
  autoplay
  muted
  playsinline>
</video>

<div id="scanFrame"></div>
```

  </div>

  <div id="status">
    読み取り準備中...
  </div>

  <div id="result"></div>

  <div id="format"></div>

  <!-- ZXing -->

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <script>

    const video =
      document.getElementById("reader");

    const status =
      document.getElementById("status");

    const resultText =
      document.getElementById("result");

    const formatText =
      document.getElementById("format");


    let lastValue = "";
    let lastTime = 0;


    // ==========================
    // ビープ音
    // ==========================

    function beep() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const audioContext =
          new AudioContext();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.frequency.value = 1800;
        oscillator.type = "square";

        gain.gain.value = 0.08;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        setTimeout(() => {

          oscillator.stop();
          audioContext.close();

        }, 80);

      } catch (e) {

        console.log("beep error", e);

      }

    }


    // ==========================
    // 読み取り成功
    // ==========================

    function onBarcode(result) {

      if (!result) {
        return;
      }


      const text =
        result.getText();


      const now =
        Date.now();


      // 同じバーコードを連続表示しない
      if (
        text === lastValue &&
        now - lastTime < 800
      ) {
        return;
      }


      lastValue = text;
      lastTime = now;


      resultText.textContent =
        text;


      if (result.getBarcodeFormat) {

        formatText.textContent =
          "形式: " +
          result.getBarcodeFormat();

      }


      status.textContent =
        "読み取り成功";


      beep();


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(60);

      }


      console.log(
        "BARCODE:",
        text
      );

    }


    // ==========================
    // ZXing開始
    // ==========================

    async function startScanner() {

      status.textContent =
        "ZXingを読み込んでいます...";


      // ZXing自体が読み込まれているか確認
      if (
        typeof ZXingBrowser ===
        "undefined"
      ) {

        status.textContent =
          "ZXing読み込み失敗";

        console.error(
          "ZXingBrowser が存在しません"
        );

        return;

      }


      console.log(
        "ZXingBrowser:",
        ZXingBrowser
      );


      // 1D専用リーダー
      const codeReader =
        new ZXingBrowser
          .BrowserMultiFormatOneDReader();


      status.textContent =
        "バーコード読み取り開始";


      try {

        const controls =
          await codeReader.decodeFromVideoDevice(

            undefined,

            video,

            (result, error) => {

              // 読み取り成功
              if (result) {

                onBarcode(result);

                return;

              }


              // 読み取り失敗は通常状態なので
              // 画面には表示しない
              if (error) {

                console.log(
                  "scan:",
                  error.name || error
                );

              }

            }

          );


        console.log(
          "ZXing scanner started",
          controls
        );


        status.textContent =
          "スキャン中";


      } catch (error) {

        console.error(
          "ZXing開始エラー:",
          error
        );


        status.textContent =
          "ZXing開始エラー: " +
          (
            error.message ||
            error
          );

      }

    }


    // ==========================
    // 起動
    // ==========================

    window.addEventListener(
      "load",
      () => {

        console.log(
          "ページ読み込み完了"
        );


        startScanner();

      }
    );

  </script>

</body>

</html>
