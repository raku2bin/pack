<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>らくらく パック</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

header {
  height: 70px;
  background: #12395b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
}

#status {
  padding: 12px 5px;
  font-size: 18px;
  min-height: 45px;
}

#cameraBox {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 300px;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
}

#reader {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
}

#frame {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 25%;
  height: 50%;
  border: 3px solid red;
  pointer-events: none;
}

#message {
  margin-top: 15px;
  font-size: 20px;
  min-height: 30px;
}

button {
  margin-top: 15px;
  padding: 12px 25px;
  font-size: 18px;
}
</style>
</head>

<body>

<header>
  らくらく パック
</header>

<div id="status">
  カメラ起動中...
</div>

<div id="cameraBox">

  <video
    id="reader"
    autoplay
    muted
    playsinline>
  </video>

  <div id="frame"></div>

</div>

<div id="message">
  バーコードをかざしてください
</div>

<button id="startButton">
  カメラを開始
</button>

<!-- ZXing -->
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<script>

let codeReader = null;
let scanning = false;
let lastCode = "";
let lastTime = 0;

const video = document.getElementById("reader");
const statusText = document.getElementById("status");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");


/* =========================
   ビープ音
========================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext = new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = 1800;

    gain.gain.value = 0.08;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    setTimeout(() => {

      oscillator.stop();
      audioContext.close();

    }, 80);

  } catch (e) {

    console.log("beep error:", e);

  }

}


/* =========================
   バーコード処理
========================= */

function processBarcode(code) {

  const now = Date.now();

  /*
    同じバーコードを連続して
    何十回も処理しない
  */

  if (
    code === lastCode &&
    now - lastTime < 800
  ) {
    return;
  }

  lastCode = code;
  lastTime = now;

  console.log("読み取り:", code);

  beep();

  /*
    JAN
  */

  if (
    /^\d+$/.test(code) &&
    (
      code.length === 8 ||
      code.length === 12 ||
      code.length === 13
    )
  ) {

    statusText.textContent = "JAN 読み取り";

    message.textContent = code;

    return;
  }


  /*
    18桁コード
    今回は確認用として読み取る
  */

  if (
    /^\d{18}$/.test(code)
  ) {

    statusText.textContent = "18桁コード 読み取り";

    message.textContent = code;

    return;
  }


  /*
    その他
  */

  statusText.textContent = "読み取り";

  message.textContent = code;

}


/* =========================
   カメラ開始
========================= */

async function startCamera() {

  if (scanning) {
    return;
  }

  statusText.textContent =
    "カメラを起動しています...";

  message.textContent =
    "少しお待ちください";

  try {

    /*
      まずブラウザから直接
      カメラを取得する
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
      カメラ映像を表示
    */

    video.srcObject = stream;

    await video.play();


    statusText.textContent =
      "カメラ起動OK";

    message.textContent =
      "バーコードをかざしてください";


    /*
      カメラ表示を確認してから
      ZXingを開始
    */

    startZXing();

  } catch (error) {

    console.error(
      "カメラエラー:",
      error
    );

    statusText.textContent =
      "カメラ読み取りエラー";

    message.textContent =
      "カメラを起動できません";

    scanning = false;

  }

}


/* =========================
   ZXing開始
========================= */

function startZXing() {

  if (scanning) {
    return;
  }

  try {

    if (
      typeof ZXingBrowser === "undefined"
    ) {

      statusText.textContent =
        "読み取り開始エラー";

      message.textContent =
        "バーコードライブラリを読み込めません";

      return;
    }


    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    scanning = true;

    statusText.textContent =
      "読み取り待機中";


    /*
      すでに表示している
      video要素をZXingに使用
    */

    codeReader.decodeFromVideoElement(
      video,
      (result, error) => {

        if (result) {

          const text =
            result.getText();

          processBarcode(text);

        }

      }
    );


  } catch (error) {

    console.error(
      "ZXingエラー:",
      error
    );

    scanning = false;

    statusText.textContent =
      "読み取り開始エラー";

    message.textContent =
      "読み取りを開始できません";

  }

}


/* =========================
   開始ボタン
========================= */

startButton.addEventListener(
  "click",
  () => {

    startCamera();

  }
);


/* =========================
   ページ読み込み
========================= */

window.addEventListener(
  "load",
  () => {

    /*
      ページを開いたら
      自動でカメラ開始
    */

    startCamera();

  }
);

</script>

</body>
