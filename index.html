<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 300px;
      margin: 15px auto 0;
      overflow: hidden;
      background: #000;
    }

    #reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 読み取り目安枠 */
    #scanFrame {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 30%;
      height: 40%;
      border: 3px solid red;
      pointer-events: none;
    }

    #status {
      margin-top: 12px;
      font-size: 18px;
      color: #ccc;
    }

    #result {
      margin-top: 15px;
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
    }

    #startButton {
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #236fa5;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    らくらく パック
  </header>

  <div id="cameraArea">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>

    <div id="scanFrame"></div>

  </div>

  <div id="status">
    カメラ起動中...
  </div>

  <div id="result"></div>

  <!-- カメラ起動できない場合の予備ボタン -->
  <button id="startButton">
    カメラを開始
  </button>

  <script>

    const video = document.getElementById("reader");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const startButton = document.getElementById("startButton");

    let stream = null;
    let detector = null;
    let scanning = false;
    let lastCode = "";
    let lastTime = 0;


    // =========================
    // 音
    // =========================

    function beep() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const audioContext =
          new AudioContext();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "square";

        oscillator.frequency.value = 1800;

        gain.gain.value = 0.08;

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.08
        );

      } catch (e) {
        // 音が使えない場合は無視
      }
    }


    // =========================
    // カメラ起動
    // =========================

    async function startCamera() {

      if (scanning) {
        return;
      }

      status.textContent =
        "カメラを起動しています...";

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            },

            audio: false
          });


        video.srcObject = stream;

        await video.play();


        // =========================
        // BarcodeDetector確認
        // =========================

        if (!("BarcodeDetector" in window)) {

          status.textContent =
            "このブラウザは高速JAN読み取りに対応していません。";

          return;
        }


        // JANだけを対象にする
        detector =
          new BarcodeDetector({

            formats: [
              "ean_13",
              "ean_8",
              "upc_a",
              "upc_e"
            ]

          });


        scanning = true;

        status.textContent =
          "JAN読み取り中";

        scanLoop();

      } catch (error) {

        console.error(error);

        status.textContent =
          "カメラを起動できません";

      }
    }


    // =========================
    // JAN読み取りループ
    // =========================

    async function scanLoop() {

      if (!scanning) {
        return;
      }

      if (
        video.readyState >=
        HTMLMediaElement.HAVE_ENOUGH_DATA
      ) {

        try {

          const codes =
            await detector.detect(video);


          if (codes.length > 0) {

            const code =
              codes[0].rawValue;


            // JAN以外を無視
            if (
              /^\d{8}$/.test(code) ||
              /^\d{12}$/.test(code) ||
              /^\d{13}$/.test(code)
            ) {

              const now =
                Date.now();


              // 同じJANを連続して鳴らし続けない
              if (
                code !== lastCode ||
                now - lastTime > 700
              ) {

                lastCode = code;
                lastTime = now;

                result.textContent = code;

                beep();

                if (
                  navigator.vibrate
                ) {
                  navigator.vibrate(40);
                }

              }

            }

          }

        } catch (error) {

          console.log(
            "読み取り中:",
            error
          );

        }

      }


      // 高速連続スキャン
      requestAnimationFrame(scanLoop);
    }


    // =========================
    // ボタン
    // =========================

    startButton.addEventListener(
      "click",
      startCamera
    );


    // =========================
    // ページ表示時に自動起動
    // =========================

    window.addEventListener(
      "load",
      () => {
        startCamera();
      }
    );

  </script>

</body>
</html>
