<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 300px;
      margin: 15px auto 0;
      overflow: hidden;
      background: #000;
    }

    #reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scanFrame {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 30%;
      height: 40%;
      border: 3px solid red;
      pointer-events: none;
    }

    #status {
      margin-top: 12px;
      font-size: 18px;
      color: #ccc;
    }

    #result {
      margin-top: 15px;
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
      word-break: break-all;
    }

    #type {
      margin-top: 5px;
      font-size: 18px;
      color: #aaa;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <header>
    らくらく パック
  </header>

  <div id="cameraArea">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>

    <div id="scanFrame"></div>

  </div>

  <div id="status">
    読み取り準備中...
  </div>

  <div id="result"></div>

  <div id="type"></div>


  <script>

    const video =
      document.getElementById("reader");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");

    const type =
      document.getElementById("type");


    let codeReader = null;

    let lastCode = "";

    let lastTime = 0;


    // ==========================
    // ピッ音
    // ==========================

    function beep() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const ctx =
          new AudioContext();

        const osc =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        osc.type = "square";

        osc.frequency.value = 1800;

        gain.gain.value = 0.08;

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
          ctx.currentTime + 0.08
        );

      } catch (e) {

      }

    }


    // ==========================
    // バーコード処理
    // ==========================

    function processBarcode(
      text,
      format
    ) {

      const now =
        Date.now();


      // 同じコードの連続反応を抑える
      if (
        text === lastCode &&
        now - lastTime < 500
      ) {
        return;
      }


      lastCode = text;

      lastTime = now;


      result.textContent = text;

      type.textContent =
        "形式: " + format;


      beep();


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(40);

      }


      console.log(
        "読み取り:",
        text,
        "形式:",
        format
      );

    }


    // ==========================
    // カメラ開始
    // ==========================

    async function startScanner() {

      try {

        status.textContent =
          "カメラを起動しています...";


        // ZXingが読み込まれているか確認
        if (
          typeof ZXingBrowser ===
          "undefined"
        ) {

          status.textContent =
            "バーコードライブラリを読み込めません";

          return;
        }


        /*
         * EAN-13 と CODE128 を含む
         * 1次元バーコードを対象にする
         */
        codeReader =
          new ZXingBrowser.BrowserMultiFormatOneDReader();


        const controls =
          await codeReader.decodeFromVideoDevice(
            undefined,
            video,
            (resultObj, error) => {

              if (resultObj) {

                const text =
                  resultObj.getText();

                const format =
                  resultObj
                    .getBarcodeFormat()
                    .toString();


                processBarcode(
                  text,
                  format
                );

              }

            }
          );


        status.textContent =
          "JAN / CODE128 読み取り中";


        window.scannerControls =
          controls;


      } catch (error) {

        console.error(error);

        status.textContent =
          "読み取り開始エラー";

      }

    }


    // ==========================
    // 開始
    // ==========================

    window.addEventListener(
      "load",
      () => {

        startScanner();

      }
    );

  </script>

</body>

</html>
