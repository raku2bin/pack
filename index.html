<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
    }

    .message {
      padding: 16px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    /* カメラ部分 */
    .camera-area {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }

    #reader {
      width: 100%;
      display: block;
    }

    /*
      読み取り枠
    */
    .scan-frame {
      position: absolute;

      left: 8%;
      right: 8%;

      top: 35%;
      height: 30%;

      border: 4px solid red;

      pointer-events: none;
    }

    /*
      枠の中央線
    */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    /*
      枠の説明
    */
    .frame-message {
      position: absolute;

      left: 0;
      right: 0;

      bottom: 8%;

      font-size: 20px;
      font-weight: bold;

      text-shadow:
        0 2px 4px #000,
        0 0 5px #000;
    }

    /*
      読み取り結果
    */
    #result {
      padding: 20px 10px;

      min-height: 90px;

      background: white;
      color: #12395b;

      font-size: 32px;
      font-weight: bold;

      word-break: break-all;
    }

  </style>

</head>

<body>

  <header>
    らくらく　パック
  </header>

  <div class="message">
    バーコードを枠内に合わせてください
  </div>

  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>

    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>

    <div class="frame-message">
      AA-赤い枠にバーコードを合わせてください
    </div>

  </div>

  <div id="result">
    カメラ起動中…
  </div>


  <!-- ZXing Browser -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <script>

    const result =
      document.getElementById("result");

    const video =
      document.getElementById("reader");


    async function startScanner() {

      try {

        /*
         * ZXing読み取りエンジン
         */
        const codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();


        /*
         * カメラ一覧取得
         */
        const devices =
          await ZXingBrowser.BrowserCodeReader
            .listVideoInputDevices();


        console.log(
          "カメラ一覧:",
          devices
        );


        if (!devices ||
            devices.length === 0) {

          result.textContent =
            "カメラが見つかりません";

          return;
        }


        /*
         * 背面カメラを優先
         */
        let deviceId =
          devices[devices.length - 1].deviceId;


        for (const device of devices) {

          const label =
            (device.label || "").toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("背面")
          ) {

            deviceId =
              device.deviceId;

            break;
          }
        }


        console.log(
          "使用カメラ:",
          deviceId
        );


        /*
         * ここで先に表示を変更する
         *
         * decodeFromVideoDevice() は
         * 連続スキャンなので、
         * await の後にはすぐ進まない。
         */
        result.textContent =
          "読み取り中…";


        /*
         * 連続バーコード読み取り開始
         */
        await codeReader.decodeFromVideoDevice(

          deviceId,

          video,

          (resultCode, error) => {

            /*
             * バーコードを発見した場合
             */
            if (resultCode) {

              const value =
                resultCode.getText();


              console.log(
                "読み取り成功:",
                value
              );


              /*
               * 18桁チェック
               */
              if (/^\d{18}$/.test(value)) {

                result.textContent =
                  value;

              } else {

                result.textContent =
                  "読み取り：" + value;

              }

            }

          }

        );


      } catch (error) {

        console.error(
          "スキャンエラー:",
          error
        );

        result.textContent =
          "エラー：" + String(error);

      }

    }


    /*
     * スキャナー開始
     */
    startScanner();

  </script>

</body>
</html>
