<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
    }

    .message {
      padding: 18px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .camera-area {
      position: relative;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      display: block;
    }

    /* 読み取り目安 */
    .scan-frame {
      position: absolute;

      left: 6%;
      right: 6%;

      top: 35%;
      height: 30%;

      border: 4px solid red;

      pointer-events: none;
    }

    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    #result {
      min-height: 100px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 32px;

      font-weight: bold;

      word-break: break-all;
    }

  </style>

</head>


<body>


<header>
  らくらく　パック
</header>


<div class="message">
  AAAバーコードを赤枠に合わせてください
</div>


<div class="camera-area">

  <video
    id="reader"
    autoplay
    muted
    playsinline>
  </video>

  <div class="scan-frame">
    <div class="scan-line"></div>
  </div>

</div>


<div id="result">
  確認中…
</div>


<script>

  const video =
    document.getElementById("reader");

  const result =
    document.getElementById("result");


  /*
   * BarcodeDetector対応確認
   */
  if (!("BarcodeDetector" in window)) {

    result.textContent =
      "このブラウザはBarcodeDetector非対応";

  } else {

    startScanner();

  }


  async function startScanner() {

    try {

      /*
       * 読み取り対象
       *
       * まずJANを優先
       */
      const detector =
        new BarcodeDetector({

          formats: [
            "ean_13",
            "ean_8",
            "upc_a",
            "upc_e",
            "code_128",
            "itf"
          ]

        });


      /*
       * カメラ起動
       */
      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      result.textContent =
        "バーコード読み取り中…";


      /*
       * 連続スキャン
       */
      scan();


      async function scan() {

        try {

          /*
           * カメラ映像から検出
           */
          const barcodes =
            await detector.detect(video);


          if (barcodes.length > 0) {

            const value =
              barcodes[0].rawValue;


            console.log(
              "★ 読み取り成功 ★",
              value
            );


            result.textContent =
              value;

          }

        } catch (error) {

          console.error(
            "検出エラー:",
            error
          );

        }


        /*
         * 約30fpsで繰り返す
         */
        requestAnimationFrame(scan);

      }


    } catch (error) {

      console.error(
        "カメラエラー:",
        error
      );


      result.textContent =
        "エラー：" + String(error);

    }

  }

</script>


</body>

</html>
