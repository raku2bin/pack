<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>らくらく パック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      height: 70px;
      background: #12395b;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    .message {
      padding: 18px 10px;
      font-size: 25px;
      font-weight: bold;
    }

    .camera-area {
      position: relative;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: auto;

      display: block;

      background: #000;
    }

    /*
     * 読み取り範囲
     */
    .scan-frame {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 30%;
      height: 40%;

      border: 5px solid red;

      pointer-events: none;
    }

    /*
     * 中央ライン
     */
    .scan-line {
      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 3px;

      background: red;

      transform: translateY(-50%);
    }

    /*
     * 読み取り結果
     */
    #result {
      min-height: 110px;

      padding: 20px 10px;

      background: white;

      color: #12395b;

      font-size: 36px;

      font-weight: bold;

      word-break: break-all;
    }

    /*
     * バーコード形式
     */
    #format {
      min-height: 50px;

      padding: 10px;

      background: #ddd;

      color: #111;

      font-size: 20px;

      font-weight: bold;
    }

  </style>

</head>


<body>


  <header>
    らくらく　パック
  </header>


  <div class="message">
    VV バーコードを赤枠に合わせてください
  </div>


  <div class="camera-area">

    <video
      id="reader"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-frame">

      <div class="scan-line"></div>

    </div>

  </div>


  <div id="result">
    カメラ起動中…
  </div>


  <div id="format">
    読み取り準備中…
  </div>


  <!--
    ZXing Browser
  -->
  <script
    src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js">
  </script>


  <script>

    const result =
      document.getElementById("result");

    const format =
      document.getElementById("format");

    const video =
      document.getElementById("reader");


    /*
     * スキャナー開始
     */
    async function startScanner() {

      try {

        /*
         * ZXing MultiFormatReader
         *
         * まずは今までJANを読めていた
         * BrowserMultiFormatReaderを使用
         */
        const codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();


        result.textContent =
          "カメラ起動中…";


        format.textContent =
          "EAN-13 / ITF / CODE-128";


        /*
         * カメラ一覧
         */
        const devices =
          await ZXingBrowser
            .BrowserCodeReader
            .listVideoInputDevices();


        console.log(
          "カメラ一覧:",
          devices
        );


        /*
         * カメラがない場合
         */
        if (
          !devices ||
          devices.length === 0
        ) {

          result.textContent =
            "カメラが見つかりません";

          format.textContent =
            "カメラなし";

          return;

        }


        /*
         * 最初のカメラ
         */
        let deviceId =
          devices[0].deviceId;


        /*
         * 背面カメラを探す
         */
        for (
          const device of devices
        ) {

          const label =
            (
              device.label || ""
            ).toLowerCase();


          if (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment") ||

            label.includes("背面")

          ) {

            deviceId =
              device.deviceId;

            break;

          }

        }


        console.log(
          "使用カメラ:",
          deviceId
        );


        result.textContent =
          "バーコード読み取り中…";


        format.textContent =
          "JAN / ITF / CODE-128 を検出中";


        /*
         * 連続読み取り開始
         */
        await codeReader.decodeFromVideoDevice(

          deviceId,

          video,

          (resultCode, error) => {


            /*
             * 読み取り成功
             */
            if (resultCode) {

              const value =
                resultCode.getText();


              console.log(
                "===================="
              );

              console.log(
                "★ 読み取り成功 ★"
              );

              console.log(
                "番号:",
                value
              );

              console.log(
                "===================="
              );


              /*
               * 番号を表示
               */
              result.textContent =
                value;


              /*
               * ZXingが判定した形式
               */
              try {

                const type =
                  resultCode.getBarcodeFormat();


                format.textContent =
                  "バーコード形式：" +
                  type;


                console.log(
                  "バーコード形式:",
                  type
                );

              }
              catch (e) {

                format.textContent =
                  "読み取り成功";

              }

            }


            /*
             * 読み取り失敗は画面に表示しない
             *
             * カメラを止めずに
             * 次のフレームを読む
             */

          }

        );


      }
      catch (error) {

        console.error(
          "カメラ・読み取りエラー:",
          error
        );


        result.textContent =
          "エラー：" +
          (
            error.name ||
            error.message ||
            String(error)
          );


        format.textContent =
          "読み取りエラー";

      }

    }


    /*
     * ページ読み込み後に開始
     */
    startScanner();

  </script>


</body>

</html>
